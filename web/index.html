<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pigeon</title>
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pigeon">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --fg: #0f172a; --muted: #64748b;
    --line: #e2e8f0; --accent: #2563eb; --accent-fg: #fff; --ok: #16a34a; --err: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1120; --card: #111827; --fg: #e5e7eb; --muted: #94a3b8;
      --line: #1f2937; --accent: #3b82f6; --accent-fg: #fff; --ok: #22c55e; --err: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  main { max-width: 560px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 10px; margin: 4px 0 16px; }
  header img { width: 32px; height: 32px; }
  h1 { font-size: 20px; margin: 0; flex: 1; }
  .lock { font-size: 12px; color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  textarea {
    width: 100%; min-height: 120px; resize: vertical; font: inherit; color: inherit;
    background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 10px;
  }
  textarea:focus, input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  button, .btn {
    appearance: none; border: 1px solid var(--line); background: transparent; color: var(--fg);
    font: inherit; font-weight: 600; padding: 10px 14px; border-radius: 10px; cursor: pointer;
  }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); flex: 1; }
  button:disabled { opacity: .5; cursor: default; }
  #drop {
    border: 2px dashed var(--line); border-radius: 12px; padding: 26px 12px; text-align: center;
    color: var(--muted); cursor: pointer;
  }
  #drop.over { border-color: var(--accent); color: var(--accent); }
  #drop input { display: none; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
  li:first-child { border-top: 0; }
  li .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ok { color: var(--ok); } .err { color: var(--err); } .muted { color: var(--muted); }
  .small { font-size: 13px; }
  code { font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  input[type=text] {
    font: inherit; color: inherit; background: transparent; border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 8px; width: 100%;
  }
  .hidden { display: none !important; }
  progress { width: 80px; }
</style>
</head>
<body>
<main>
  <header>
    <img src="icon.svg" alt="">
    <h1>Pigeon</h1>
    <span class="lock" id="fp"></span>
  </header>

  <section id="unpaired" class="card hidden">
    <h2 style="margin-top:0;font-size:17px">Not paired yet</h2>
    <p class="muted">On your Mac, open Pigeon in the menu bar and choose <b>Pair a device…</b>. Scan the QR code with this device's camera, or open the link it shows.</p>
  </section>

  <section id="paired" class="hidden">
    <div class="card">
      <textarea id="text" placeholder="Type or paste text to send…" autocapitalize="off" autocomplete="off" spellcheck="false"></textarea>
      <div class="row">
        <button id="pasteSend">Paste &amp; send</button>
        <button id="sendText" class="primary">Send text</button>
      </div>
    </div>

    <div class="card">
      <label id="drop">
        <input id="file" type="file" multiple>
        <div><b>Drop files here</b> or tap to choose</div>
        <div class="small">Photos, screenshots, documents… up to <span id="maxmb">100</span> MB each</div>
      </label>
    </div>

    <div class="card">
      <ul id="log"><li class="muted">Nothing sent yet.</li></ul>
    </div>

    <details class="card small">
      <summary>This device</summary>
      <p><label>Name shown on the Mac<br><input id="devname" type="text" maxlength="40"></label></p>
      <p class="muted">Key fingerprint <code id="fpfull"></code>. It should match the fingerprint shown in the Mac app's pairing window.</p>
      <button id="forget">Forget pairing</button>
    </details>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
