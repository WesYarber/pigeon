# Pigeon for iPhone. The Xcode project is generated from this file:
#   cd ios && xcodegen    (then open Pigeon.xcodeproj)
# Put your team in ios/Config/Local.xcconfig (not committed):
#   DEVELOPMENT_TEAM = ABCDE12345
name: Pigeon
options:
  bundleIdPrefix: net.wesyarber
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Pigeon:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - path: ../mac/Sources/Crypto.swift   # the exact encryption the Mac uses
        group: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.wesyarber.pigeon.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Pigeon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Pigeon
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: Pigeon uses the camera to scan the pairing QR code your Mac shows.
    entitlements:
      path: App/Pigeon.entitlements
      properties:
        com.apple.security.application-groups: [group.net.wesyarber.pigeon]
        keychain-access-groups: [$(AppIdentifierPrefix)net.wesyarber.pigeon.ios]
    dependencies:
      - target: PigeonShare
  PigeonShare:
    type: app-extension
    platform: iOS
    sources:
      - Share
      - Shared
      - path: ../mac/Sources/Crypto.swift
        group: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.wesyarber.pigeon.ios.share
        INFOPLIST_KEY_CFBundleDisplayName: Pigeon
    info:
      path: Share/Info.plist
      properties:
        CFBundleDisplayName: Pigeon
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsAttachmentsWithMaxCount: 20
              NSExtensionActivationSupportsFileWithMaxCount: 20
              NSExtensionActivationSupportsImageWithMaxCount: 20
              NSExtensionActivationSupportsMovieWithMaxCount: 20
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    entitlements:
      path: Share/PigeonShare.entitlements
      properties:
        com.apple.security.application-groups: [group.net.wesyarber.pigeon]
        keychain-access-groups: [$(AppIdentifierPrefix)net.wesyarber.pigeon.ios]
